http:
  routers:
    # ACME challenge passthrough — MUST have highest priority
    acme-challenge:
      rule: "PathPrefix(`/.well-known/acme-challenge/`)"
      entryPoints:
        - web
      service: noop@internal
      priority: 1000

    # HTTPS router
    erpnext:
      rule: "HostRegexp(`[a-z0-9-]+(\\.[a-z0-9-]+)*\\.sanvidhierp\\.in`)"
      entryPoints:
        - websecure
      service: erpnext
      tls:
        certResolver: le
        domains:
          - main: "test.stampings.sanvidhierp.in"
          - main: "shree.electricals.sanvidhierp.in"
          - main: "shree.stampings.sanvidhierp.in"
          - main: "verstech.sanvidhierp.in"
          - main: "test.electricals.sanvidhierp.in"

    # HTTP router — redirects to HTTPS
    erpnext-http:
      rule: "HostRegexp(`[a-z0-9-]+(\\.[a-z0-9-]+)*\\.sanvidhierp\\.in`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: erpnext
      priority: 1

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    erpnext:
      loadBalancer:
        servers:
          - url: "http://frontend:8080"

tls:
  options:
    default:
      minVersion: VersionTLS12
