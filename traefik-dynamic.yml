http:
  routers:
    # HTTPS router
    erpnext:
      rule: "HostRegexp(`[a-z0-9-]+(\\.[a-z0-9-]+)*\\.sanvidhierp\\.in`)"
      entryPoints:
        - websecure
      service: erpnext
      tls:
        certResolver: le
        domains:
          - main: "test.asfsl.sanvidhierp.in"       # ← add each new customer here
          - main: "asfsl.sanvidhierp.in"

    # HTTP router — redirects to HTTPS
    erpnext-http:
      rule: "HostRegexp(`[a-z0-9-]+(\\.[a-z0-9-]+)*\\.sanvidhierp\\.in`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: erpnext

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    erpnext:
      loadBalancer:
        servers:
          - url: "http://frontend:8080"

tls:
  options:
    default:
      minVersion: VersionTLS12
